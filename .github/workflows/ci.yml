name: CI

# Builds the iOS app on every push to any branch except main (main is built and sent to TestFlight by Codemagic).
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Tests (logic and the page script in a real web view)
        run: |
          cd ios
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $UDID"
          xcodebuild test -project EPUBSwift.xcodeproj -scheme EPUBSwiftTests             -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO | tail -60
          exit ${PIPESTATUS[0]}
      - name: Build (Debug, simulator)
        run: |
          cd ios
          xcodebuild -project EPUBSwift.xcodeproj -scheme EPUBSwift \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
          exit ${PIPESTATUS[0]}
      - name: Build (Release, simulator)
        run: |
          cd ios
          xcodebuild -project EPUBSwift.xcodeproj -scheme EPUBSwift -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
          exit ${PIPESTATUS[0]}
