name: Screenshots and screen recording

# Run by hand (Actions tab, "Run workflow"). Builds the debug app, runs it in the iPhone and iPad simulators with sample books and
# sample notes (no ads, nothing from the App Store build), takes a screenshot of each screen and records one continuous video of
# the tour, then frames them into finished App Store listing images. Download from the run's Artifacts: `listing-screenshots` is the one
# to upload; `raw-screenshots-and-recording` has the plain captures and the video.
on:
  # Also runs on every push to the screenshots branch, so it works before this file is on the main branch.
  push:
    branches: [screenshots-workflow]
  workflow_dispatch:
    inputs:
      branch_note:
        description: "Optional note shown in the run name"
        required: false
        default: ""

jobs:
  shots:
    name: Screenshots and recording
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: |
          brew install xcodegen
          cd ios
          # The sample books exist only in this build, never in the App Store build.
          mkdir -p EPUBSwift/ScreenshotSamples
          cp ScreenshotSamples/*.epub EPUBSwift/ScreenshotSamples/
          xcodegen generate

      - name: Build for the simulator
        run: |
          cd ios
          xcodebuild -project EPUBSwift.xcodeproj -scheme EPUBSwift \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/sim" \
            CODE_SIGNING_ALLOWED=NO build | tail -20
          exit ${PIPESTATUS[0]}

      - name: Take screenshots and record the tour
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/sim/Build/Products" -maxdepth 3 -name "EPUBSwift.app" | head -1)
          echo "App: $APP"
          OUTROOT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUTROOT"

          # name:seconds to wait before the screenshot (screens that prepare sample notes need longer)
          SHOTS="library:10 reader:12 highlight:24 notes:26 sketch:30 create:10 bookeditor:12 export:14 tools:10 pdf:14 readerNight:12 paywall:10"

          find_device() {  # $1 = name pattern; prints the UDID of the newest matching available simulator
            xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          pattern = re.compile(sys.argv[1])
          found = []
          for runtime, devices in sorted(json.load(sys.stdin)['devices'].items()):
              if 'iOS' not in runtime: continue
              for d in devices:
                  if pattern.search(d['name']): found.append(d['udid'])
          print(found[-1] if found else '')
          " "$1"
          }

          shoot() {  # $1 = device name pattern, $2 = output folder name
            UDID=$(find_device "$1")
            if [ -z "$UDID" ]; then echo "No simulator matches $1"; return; fi
            echo "Using $UDID for $1"
            OUT="$OUTROOT/$2"; mkdir -p "$OUT"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
              --cellularMode active --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$UDID" "$APP"
            sleep 20            # the simulator shows a one-time system banner after booting; let it pass first
            xcrun simctl io "$UDID" recordVideo --codec h264 --force "$OUT/tour.mp4" &
            REC=$!
            sleep 3
            for entry in $SHOTS; do
              s=${entry%%:*}; wait_s=${entry##*:}
              xcrun simctl launch "$UDID" cc.epubswift.app -shot "$s"
              sleep "$wait_s"
              xcrun simctl io "$UDID" screenshot "$OUT/$s.png"
              sleep 2
              xcrun simctl terminate "$UDID" cc.epubswift.app || true
            done
            kill -INT $REC || true
            wait $REC || true
            sips -g pixelWidth -g pixelHeight "$OUT/library.png" || true
            xcrun simctl shutdown "$UDID" || true
          }

          echo "Available simulators:"; xcrun simctl list devices available | grep -iE "iPhone|iPad" | sed 's/^ *//' | head -40
          shoot "iPhone .* Pro Max" iphone
          shoot "iPad Pro 13" ipad
          ls -laR "$OUTROOT"

      - name: Make the finished App Store listing screenshots
        run: |
          pip3 install pillow
          # Gradient background, caption and rounded device frame, in every App Store size. Output is ready to upload.
          python3 store/frame_screenshots.py out listing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-screenshots
          path: listing/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-screenshots-and-recording
          path: out/
          retention-days: 14
