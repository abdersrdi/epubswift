name: EPUBSwift
options:
  bundleIdPrefix: cc.epubswift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.0.0
targets:
  EPUBSwift:
    type: application
    platform: iOS
    sources:
      - path: EPUBSwift
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.epubswift.app
        PRODUCT_NAME: EPUBSwift
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EPUBSwift/Info.plist
        # AdMob APP ID. Debug uses Google's sample id; Release uses the production iOS app id.
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
      configs:
        Release:
          ADMOB_APP_ID: ca-app-pub-2683853184901962~3033922016
schemes:
  EPUBSwift:
    build:
      targets:
        EPUBSwift: all
    run:
      config: Debug
    archive:
      config: Release
